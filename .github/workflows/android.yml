name: Android build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install compile SDK
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - name: Build and run unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
